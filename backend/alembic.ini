[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# The real connection string comes from app.config.get_settings().database_url
# (i.e. DATABASE_URL / backend/.env) via migrations/env.py -- this file's
# sqlalchemy.url is a harmless local-dev fallback only, never used in CI/prod.
sqlalchemy.url = sqlite:///./delivery.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
