name: security

# Enforces the >=99% security gate (docs/ENGINEERING_STANDARDS.md):
# secret scanning (gitleaks) + dependency scanning (pip-audit).
# A finding blocks the merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend dependencies
        run: |
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt
          else
            echo "No lockfile yet; auditing project metadata. See docs/security/dependency-scanning.md."
            pip-audit --path backend
          fi
